name: successvan

services:
  app:
    container_name: successvan-app
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env_production
    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    # Keep Next.js private; Nginx on the EC2 host will proxy to it.
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  env_production:
    file: ./.env.production
